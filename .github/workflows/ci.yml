name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create Doctor-only environment
        run: |
          printf 'NEXT_PUBLIC_AGORA_APP_ID=0123456789abcdef0123456789abcdef\nNEXT_AGORA_APP_CERTIFICATE=fedcba9876543210fedcba9876543210\n' > .env.local

      - run: pnpm run verify

      - name: Verify production call-page HTML
        run: |
          pnpm run start > /tmp/rtc-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          SSR_TEST_BASE_URL=http://localhost:3000 node --test tests/ssr-html.test.mjs

  npm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --package-lock=false

      - name: Create Doctor-only environment
        run: |
          printf 'NEXT_PUBLIC_AGORA_APP_ID=0123456789abcdef0123456789abcdef\nNEXT_AGORA_APP_CERTIFICATE=fedcba9876543210fedcba9876543210\n' > .env.local

      - run: npm run doctor
      - run: rm .env.local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: test ! -e package-lock.json
